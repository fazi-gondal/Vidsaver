[project]
name = "vidsaver"
version = "1.5.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Fazi-Gondal", email = "nextinpk@gmail.com" }]
dependencies = [
    "flet==1.1.2",
    "flet-video==1.1.2",
    "flet-media-scanner==1.0.3",
    "yt-dlp",
    "requests",
    "certifi",
    "charset-normalizer",
    "idna",
    "urllib3",
]

[dependency-groups]
dev = [
    "flet-cli==1.1.2",
    "flet-desktop==1.1.2",
    "flet-web==1.1.2",
]
# Phase 1 PoCs — do NOT enable in production until device tests pass.
# Usage: uv sync --group phase1-ffmpeg   or   --group phase1-notifications
phase1-ffmpeg = [
    "flet-libffmpeg",
    "av",
]
phase1-notifications = [
    "flet-notifications==1.1.2",
]

[tool.flet]
org = "com.fazi"
product = "Vidsaver"
company = "NextInPK"
copyright = "Copyright (C) 2023-2026 by Fazi-Gondal"
python_version = "3.14"

[tool.flet.icons]
android = "assets/icon.png"
splash_android = "assets/splash_android.png"

[tool.flet.app]
path = "src"

[tool.flet.android]
split_per_abi = true
target_arch = ["arm64-v8a"]
dependencies = [
    "certifi",
    "charset-normalizer",
    "idna",
    "requests",
    "urllib3",
    "yt-dlp",
    "flet-media-scanner",
]

[tool.flet.android.permission]
"android.permission.INTERNET" = true
# Enable after Phase 1 notifications PoC / when shipping flet-notifications:
# "android.permission.POST_NOTIFICATIONS" = true
# "android.permission.FOREGROUND_SERVICE" = true
# "android.permission.FOREGROUND_SERVICE_DATA_SYNC" = true

[tool.flet.extensions]
flet_media_scanner = "flet_media_scanner.Extension"

[tool.flet.dev_packages]
flet-media-scanner = "packages/flet-media-scanner"

[tool.uv.sources]
flet-media-scanner = { workspace = true }

[tool.uv.workspace]
members = ["packages/flet-media-scanner"]
