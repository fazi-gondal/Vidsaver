[project]
name = "vidsaver"
version = "1.6.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Fazi-Gondal", email = "nextinpk@gmail.com" }]
dependencies = [
    "flet==1.1.2",
    "flet-video==1.1.2",
    "flet-media-scanner==1.0.3",
    "yt-dlp",
    "requests",
    "certifi",
    "charset-normalizer",
    "idna",
    "urllib3",
]

[dependency-groups]
dev = [
    "flet-cli==1.1.2",
    "flet-desktop==1.1.2",
    "flet-web==1.1.2",
    "pytest>=9.0",
    "ruff>=0.15",
]

[tool.flet]
org = "com.fazi"
product = "Vidsaver"
company = "NextInPK"
copyright = "Copyright (C) 2023-2026 by Fazi-Gondal"
python_version = "3.14"

[tool.flet.icons]
android = "assets/icon.png"
splash_android = "assets/splash_android.png"

[tool.flet.app]
path = "src"
exclude = [
    ".git",
    ".github",
    ".pytest_cache",
    ".venv",
    "build",
    "dist",
    "ref",
    "tests",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "README.md",
    "uv.lock",
]

[tool.flet.compile]
app = true
packages = true
cleanup = true

[tool.flet.android]
split_per_abi = true
target_arch = ["arm64-v8a"]
dependencies = [
    "certifi",
    "charset-normalizer",
    "idna",
    "requests",
    "urllib3",
    "yt-dlp",
    "flet-media-scanner",
]

[tool.flet.android.permission]
"android.permission.INTERNET" = true

[tool.flet.extensions]
flet_media_scanner = "flet_media_scanner.Extension"

[tool.flet.dev_packages]
flet-media-scanner = "packages/flet-media-scanner"

[tool.uv.sources]
flet-media-scanner = { workspace = true }

[tool.uv.workspace]
members = ["packages/flet-media-scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
