# docs: https://docs.flet.dev/publish/#github-actions

name: Build & Release Vidsaver

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # -------- Windows --------
          - name: windows
            runner: windows-latest
            build_cmd: "flet build windows --source-packages packages/flet-media-scanner"
            artifact_path: "build/windows"
            linux_deps: false

          # -------- Android APK (arm64-v8a only) --------
          - name: apk
            runner: ubuntu-latest
            build_cmd: "flet build apk --split-per-abi --arch arm64-v8a --source-packages packages/flet-media-scanner"
            artifact_path: "build/apk"
            linux_deps: false
            android_signing: true

          # -------- Disabled Builds --------
          # Uncomment these targets when you need them again.

          # - name: linux
          #   runner: ubuntu-latest
          #   build_cmd: "flet build linux"
          #   artifact_path: "build/linux"
          #   linux_deps: true

          # - name: macos
          #   runner: macos-latest
          #   build_cmd: "flet build macos"
          #   artifact_path: "build/macos"
          #   linux_deps: false

          # - name: aab
          #   runner: ubuntu-latest
          #   build_cmd: "flet build aab"
          #   artifact_path: "build/aab"
          #   linux_deps: false

          # - name: ipa
          #   runner: macos-latest
          #   build_cmd: "flet build ipa"
          #   artifact_path: "build/ipa"
          #   linux_deps: false

          # - name: web
          #   runner: ubuntu-latest
          #   build_cmd: "flet build web"
          #   artifact_path: "build/web"
          #   linux_deps: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            packages/flet-media-scanner/pyproject.toml
            packages/flet-media-scanner/src/flet_media_scanner/**/*.py
            packages/flet-media-scanner/src/flutter/flet_media_scanner/lib/**/*.dart
            packages/flet-media-scanner/src/flutter/flet_media_scanner/android/**/*.gradle
            packages/flet-media-scanner/src/flutter/flet_media_scanner/android/**/*.kt
            packages/flet-media-scanner/src/flutter/flet_media_scanner/android/**/*.xml
            packages/flet-media-scanner/src/flutter/flet_media_scanner/pubspec.yaml

      - name: Install Linux dependencies
        if: matrix.linux_deps
        shell: bash
        run: |
          sudo apt update --allow-releaseinfo-change
          sudo apt install -y --no-install-recommends \
            clang \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libasound2-dev \
            libmpv-dev \
            mpv \
            libsecret-1-0 \
            libsecret-1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-tools \
            gstreamer1.0-x \
            gstreamer1.0-alsa \
            gstreamer1.0-gl \
            gstreamer1.0-gtk3 \
            gstreamer1.0-pulseaudio

      - name: Prepare Android signing key
        if: matrix.android_signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is required for signed Android releases." >&2
            exit 1
          fi

          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > upload-keystore.jks

      - name: Build application
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ "${{ matrix.android_signing }}" = "true" ]; then
            if [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] || [ -z "${ANDROID_KEY_PASSWORD}" ] || [ -z "${ANDROID_KEY_ALIAS}" ]; then
              echo "ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, and ANDROID_KEY_ALIAS secrets are required for signed Android releases." >&2
              exit 1
            fi

            KEYSTORE_PATH="$(pwd)/upload-keystore.jks"

            uv run ${{ matrix.build_cmd }} \
              --android-signing-key-store "${KEYSTORE_PATH}" \
              --android-signing-key-store-password "${ANDROID_KEYSTORE_PASSWORD}" \
              --android-signing-key-password "${ANDROID_KEY_PASSWORD}" \
              --android-signing-key-alias "${ANDROID_KEY_ALIAS}" \
              --yes --verbose
          else
            uv run ${{ matrix.build_cmd }} --yes --verbose
          fi

      - name: Verify build output
        shell: bash
        run: |
          ls -R "${{ matrix.artifact_path }}"

      - name: Create Windows MSI installer
        if: matrix.name == 'windows'
        shell: python
        run: |
          import subprocess, pathlib, os, sys, glob

          tag = "${{ github.ref_name }}"
          version = tag.lstrip("v") if tag else "1.0.0"
          parts = version.split(".")
          while len(parts) < 3:
              parts.append("0")
          msi_version = ".".join(parts[:3])

          os.makedirs("installer", exist_ok=True)

          # Find WiX bin directory
          wix_bin = None
          possible_dirs = glob.glob(r"C:\Program Files (x86)\WiX Toolset v*\bin")
          for d in possible_dirs:
              if os.path.exists(os.path.join(d, "candle.exe")):
                  wix_bin = d
                  break

          if not wix_bin:
              for p in os.environ.get("PATH", "").split(os.pathsep):
                  if os.path.exists(os.path.join(p, "candle.exe")):
                      wix_bin = p
                      break

          if not wix_bin:
              print("WiX 3 not found in standard paths.")
              sys.exit(1)

          heat = os.path.join(wix_bin, "heat.exe")
          candle = os.path.join(wix_bin, "candle.exe")
          light = os.path.join(wix_bin, "light.exe")

          # Detect exe name inside build/windows
          exes = [e.name for e in pathlib.Path("build/windows").rglob("*.exe")]
          main_exe = exes[0] if exes else "vidsaver.exe"
          print(f"Main executable: {main_exe}")

          # 1. Harvest files using heat (-srd suppresses root directory wrapper)
          subprocess.run([
              heat, "dir", "build/windows",
              "-cg", "AppFiles",
              "-dr", "INSTALLFOLDER",
              "-scom", "-sreg", "-sfrag", "-gg", "-srd",
              "-out", "files.wxs"
          ], check=True)

          # Filter files.wxs to remove .pyc, __pycache__, and non-existent files
          import xml.etree.ElementTree as ET
          ns_url = "http://schemas.microsoft.com/wix/2006/wi"
          ET.register_namespace("", ns_url)
          tree = ET.parse("files.wxs")
          root = tree.getroot()

          # Find and remove components containing .pyc, __pycache__, or missing files
          removed_count = 0
          for parent in root.findall(f".//{{{ns_url}}}Directory") + root.findall(f".//{{{ns_url}}}DirectoryRef"):
              for comp in list(parent.findall(f"{{{ns_url}}}Component")):
                  for file_elem in comp.findall(f"{{{ns_url}}}File"):
                      source = file_elem.attrib.get("Source", "")
                      if source.endswith(".pyc") or "__pycache__" in source or not os.path.exists(source):
                          parent.remove(comp)
                          removed_count += 1
                          break
          print(f"Filtered out {removed_count} pyc/cache/missing file components from WiX manifest.")
          tree.write("files.wxs", encoding="utf-8", xml_declaration=True)

          # 2. Write Product.wxs
          product_wxs = f'''<?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
              <Product Id="*" Name="Vidsaver" Language="1033" Version="{msi_version}" Manufacturer="NextInPK" UpgradeCode="7F13F6E2-81B4-4D88-92A3-9A2E12F851A9">
                  <Package InstallerVersion="200" Compressed="yes" InstallScope="perMachine" />
                  <MajorUpgrade DowngradeErrorMessage="A newer version of Vidsaver is already installed." />
                  <MediaTemplate EmbedCab="yes" />

                  <Feature Id="ProductFeature" Title="Vidsaver" Level="1">
                      <ComponentGroupRef Id="AppFiles" />
                      <ComponentRef Id="ApplicationShortcut" />
                  </Feature>
              </Product>

              <Fragment>
                  <Directory Id="TARGETDIR" Name="SourceDir">
                      <Directory Id="ProgramFiles64Folder">
                          <Directory Id="INSTALLFOLDER" Name="Vidsaver" />
                      </Directory>
                      <Directory Id="ProgramMenuFolder">
                          <Directory Id="ApplicationProgramsFolder" Name="Vidsaver"/>
                      </Directory>
                  </Directory>
              </Fragment>

              <Fragment>
                  <DirectoryRef Id="ApplicationProgramsFolder">
                      <Component Id="ApplicationShortcut" Guid="8C28D052-1A4C-4F9C-9C5A-2F1E0F5B8A12">
                          <Shortcut Id="ApplicationStartMenuShortcut"
                                    Name="Vidsaver"
                                    Description="Vidsaver Video Downloader"
                                    Target="[INSTALLFOLDER]{main_exe}"
                                    WorkingDirectory="INSTALLFOLDER"/>
                          <RemoveFolder Id="CleanUpShortCut" Directory="ApplicationProgramsFolder" On="uninstall"/>
                          <RegistryValue Root="HKCU" Key="Software\\NextInPK\\Vidsaver" Name="installed" Type="integer" Value="1" KeyPath="yes"/>
                      </Component>
                  </DirectoryRef>
              </Fragment>
          </Wix>
          '''

          pathlib.Path("product.wxs").write_text(product_wxs, encoding="utf-8")

          # 3. Compile with candle
          subprocess.run([candle, "product.wxs", "files.wxs"], check=True)

          # 4. Link with light (-b build/windows sets base path for file resolution)
          msi_out = f"installer/Vidsaver-{tag}-Windows.msi" if tag else "installer/Vidsaver-Windows.msi"
          subprocess.run([light, "product.wixobj", "files.wixobj", "-b", "build/windows", "-out", msi_out], check=True)
          print(f"Generated MSI installer at {msi_out}")

      - name: Upload Windows MSI artifact
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: installer/*.msi
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show downloaded artifacts
        shell: bash
        run: |
          ls -R artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir release
          VERSION="${GITHUB_REF_NAME}"

          if [ -d "artifacts/windows-build" ]; then
            (cd artifacts && zip -9 -r "../release/Vidsaver-${VERSION}-Windows.zip" windows-build)
          else
            echo "Missing Windows build artifact." >&2
            exit 1
          fi

          MSI="$(find artifacts/windows-msi -type f -name "*.msi" 2>/dev/null | head -n 1)"
          if [ -n "${MSI}" ]; then
            cp "${MSI}" "release/Vidsaver-${VERSION}-Windows.msi"
          else
            echo "Missing Windows MSI artifact." >&2
            exit 1
          fi

          if [ ! -d "artifacts/apk-build" ]; then
            echo "Missing Android APK artifact." >&2
            exit 1
          fi

          APK="$(find artifacts/apk-build -type f -name "*arm64-v8a*.apk" | head -n 1)"
          if [ -n "${APK}" ]; then
            cp "${APK}" "release/Vidsaver-${VERSION}-Android-arm64-v8a.apk"
            zip -9 "release/Vidsaver-${VERSION}-Android-arm64-v8a.zip" "${APK}"
          else
            echo "Missing Android arm64-v8a APK artifact." >&2
            find artifacts/apk-build -type f -name "*.apk" -print >&2
            exit 1
          fi

          ls -lh release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/Vidsaver-${{ github.ref_name }}-Windows.zip
            release/Vidsaver-${{ github.ref_name }}-Windows.msi
            release/Vidsaver-${{ github.ref_name }}-Android-arm64-v8a.apk
            release/Vidsaver-${{ github.ref_name }}-Android-arm64-v8a.zip

      - name: Upload release assets as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release
          overwrite: true
          compression-level: 0
